<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Acceso | by Fraam Mascotas</title><link rel="stylesheet" href="../style.css"></head><body><header class="top"><a class="brand" href="../">by <b>Fraam</b></a><span>ADMINISTRACIÓN</span></header><main class="page narrow"><section class="panel"><p class="eyebrow">ÁREA PRIVADA</p><h1 style="font-size:38px">Ingresar</h1><p class="muted">Acceso exclusivo para usuarios administradores autorizados.</p><form id="login"><label for="email">Correo electrónico</label><input id="email" type="email" autocomplete="username" required><label for="password">Contraseña</label><input id="password" type="password" autocomplete="current-password" required minlength="6"><div class="row" style="margin-top:18px"><button class="primary" id="submit" type="submit">Ingresar</button><button type="button" id="forgot">Recuperar contraseña</button></div><p id="message" class="msg" role="status"></p></form></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script><script src="../js/config.js"></script><script src="../js/supabase.js"></script><script src="../js/common.js"></script><script>
const db=window.BF, form=document.getElementById('login'), msg=document.getElementById('message');
if(db) db.auth.getSession().then(async({data})=>{if(data.session){const {data:r}=await db.from('admin_users').select('user_id').eq('user_id',data.session.user.id).maybeSingle();if(r)location.replace('../panel/');}});
form.addEventListener('submit',async e=>{e.preventDefault();if(!db){msg.textContent='Configurá js/config.js con tus datos de Supabase.';msg.className='msg error';return;}const b=document.getElementById('submit');b.disabled=true;msg.textContent='Verificando acceso...';try{const {error}=await db.auth.signInWithPassword({email:document.getElementById('email').value.trim(),password:document.getElementById('password').value});if(error)throw error;const {data:s}=await db.auth.getSession();const {data:r,error:re}=await db.from('admin_users').select('user_id').eq('user_id',s.session.user.id).maybeSingle();if(re||!r){await db.auth.signOut();throw new Error('El usuario inició sesión, pero todavía no tiene permisos de administrador.');}location.href='../panel/';}catch(err){msg.textContent=err.message||'No se pudo iniciar sesión.';msg.className='msg error';}finally{b.disabled=false;}});
document.getElementById('forgot').addEventListener('click',async()=>{if(!db){msg.textContent='Configurá primero js/config.js.';msg.className='msg error';return;}const email=document.getElementById('email').value.trim();if(!email){msg.textContent='Escribí tu correo en el campo superior y volvé a tocar Recuperar contraseña.';msg.className='msg error';return;}try{const redirectTo=window.BF_CONFIG.SITE_URL.replace(/\/?$/,'/')+'acceso/recuperar.html';const {error}=await db.auth.resetPasswordForEmail(email,{redirectTo});if(error)throw error;msg.textContent='Si el correo está registrado, Supabase enviará instrucciones. Revisá también Spam. No solicites varios correos seguidos.';msg.className='msg ok';}catch(err){msg.textContent=err.message||'No se pudo solicitar la recuperación.';msg.className='msg error';}});
</script></body></html>
