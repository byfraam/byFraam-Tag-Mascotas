<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Crear nueva contraseña | by Fraam</title><link rel="stylesheet" href="../style.css"></head><body><header class="top"><a class="brand" href="../">by <b>Fraam</b></a><span>RECUPERACIÓN</span></header><main class="page narrow"><section class="panel"><h1 style="font-size:36px">Nueva contraseña</h1><p class="muted">Abrí esta página desde el enlace de recuperación que recibiste por correo.</p><p id="status" class="msg" role="status">Validando el enlace...</p><form id="reset" hidden><label for="pass">Nueva contraseña</label><input id="pass" type="password" minlength="8" autocomplete="new-password" required><label for="pass2">Repetir contraseña</label><input id="pass2" type="password" minlength="8" autocomplete="new-password" required><button class="primary" style="margin-top:18px" type="submit" id="save">Guardar contraseña</button></form></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script><script src="../js/config.js"></script><script src="../js/supabase.js"></script><script>
(async()=>{const db=window.BF,status=document.getElementById('status'),form=document.getElementById('reset');function show(t,ok=false){status.textContent=t;status.className='msg '+(ok?'ok':'error');}if(!db){show('Falta configurar Supabase en js/config.js.');return;}const params=new URLSearchParams(location.search);const token_hash=params.get('token_hash');const type=params.get('type');if(token_hash && type==='recovery'){const {error}=await db.auth.verifyOtp({token_hash,type:'recovery'});if(error){show('El enlace venció o ya fue utilizado. Volvé a solicitar uno nuevo después de esperar el límite de envío.');return;}}
const {data,error}=await db.auth.getSession();if(error||!data.session){show('No encontramos una sesión de recuperación válida. El enlace puede haber vencido, ya haberse utilizado o el proveedor de correo pudo abrirlo antes.');return;}show('Enlace válido. Elegí una contraseña nueva.',true);form.hidden=false;
form.addEventListener('submit',async e=>{e.preventDefault();const p=document.getElementById('pass').value,p2=document.getElementById('pass2').value;if(p!==p2){show('Las contraseñas no coinciden.');return;}if(p.length<8){show('Usá al menos 8 caracteres.');return;}const b=document.getElementById('save');b.disabled=true;const {error}=await db.auth.updateUser({password:p});if(error){show(error.message);b.disabled=false;return;}await db.auth.signOut();form.hidden=true;show('Contraseña actualizada. Ya podés ingresar con la nueva contraseña.',true);});})();
</script></body></html>
