<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111111">
  <title>Restablecer contraseña | by Fraam</title>
  <style>
    :root {
      color-scheme: dark;
      --fondo: #101010;
      --panel: #1c1c1c;
      --texto: #f5f5f5;
      --secundario: #b9b9b9;
      --borde: #373737;
      --acento: #d6ff65;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      background: var(--fondo);
      color: var(--texto);
      font-family: Arial, Helvetica, sans-serif;

      width: min(100%, 420px);

    }

      width: 100%;

    }

      margin-top: 16px;

      display: block;
      margin-top: 22px;
      text-align: center;
      color: var(--secundario);
      font-size: 13px;
    }
  </style>
</head>
<body>
  <main>
    <div class="marca">by <span>Fraam</span></div>

    <h1>Nueva contraseña</h1>
    <p>Ingresá una contraseña nueva para tu cuenta administrativa.</p>

    <form id="formulario">
      <label for="clave">Nueva contraseña</label>
      <input
        id="clave"
        type="password"
        autocomplete="new-password"
        minlength="8"
        required
      >

      <label for="confirmacion">Repetí la contraseña</label>
      <input
        id="confirmacion"
        type="password"
        autocomplete="new-password"
        minlength="8"
        required
      >

      <button id="guardar" type="submit">Guardar contraseña</button>
      <p id="mensaje" role="status" aria-live="polite">
        Esperando validación del enlace de recuperación...
      </p>
    </form>

    <a href="./index.html">Volver al acceso administrativo</a>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/supabase-client.js"></script>

  <script>
    (function () {
      const formulario = document.getElementById("formulario");
      const clave = document.getElementById("clave");
      const confirmacion = document.getElementById("confirmacion");
      const guardar = document.getElementById("guardar");
      const mensaje = document.getElementById("mensaje");

      let sesionValida = false;

      function informar(texto) {
        mensaje.textContent = texto;
      }

      async function iniciar() {
        if (!window.BF_SUPABASE) {
          informar("No se pudo conectar con Supabase.");
          guardar.disabled = true;
          return;
        }

        const cliente = window.BF_SUPABASE;
        const hash = new URLSearchParams(
          window.location.hash.slice(1)
        );
        const query = new URLSearchParams(window.location.search);
        const tokenHash = query.get("token_hash");
        const tipo = query.get("type");

        try {
          if (tokenHash && tipo === "recovery") {
            const { error } = await cliente.auth.verifyOtp({
              token_hash: tokenHash,
              type: "recovery"
            });

            if (error) {
              informar("El enlace es inválido o venció. Solicitá uno nuevo desde el acceso.");
              guardar.disabled = true;
              return;
            }
          } else if (hash.get("error") || hash.get("error_description")) {
            informar("El enlace es inválido o venció. Solicitá uno nuevo desde el acceso.");
            guardar.disabled = true;
            return;
          }

          const { data, error } = await cliente.auth.getSession();

          if (error || !data.session) {
            informar("No encontramos una sesión de recuperación válida. Solicitá un nuevo enlace desde el acceso.");
            guardar.disabled = true;
            return;
          }

          sesionValida = true;
          guardar.disabled = false;
          informar("Enlace validado. Ya podés establecer tu contraseña nueva.");
        } catch (error) {
          informar("No se pudo validar el enlace. Solicitá uno nuevo desde el acceso.");
          guardar.disabled = true;
        }
      }

      formulario.addEventListener("submit", async function (evento) {
        evento.preventDefault();

        if (!sesionValida || !window.BF_SUPABASE) {
          informar("Primero necesitás abrir un enlace de recuperación válido.");
          return;
        }

        if (clave.value.length < 8) {
          informar("La contraseña debe tener al menos 8 caracteres.");
          return;
        }

        if (clave.value !== confirmacion.value) {
          informar("Las contraseñas no coinciden.");
          return;
        }

        guardar.disabled = true;
        informar("Actualizando contraseña...");

        try {
          const { error } = await window.BF_SUPABASE.auth.updateUser({
            password: clave.value
          });

          if (error) {
            informar("No se pudo actualizar la contraseña. Intentá solicitar un nuevo enlace.");
            return;
          }

          await window.BF_SUPABASE.auth.signOut();
          formulario.reset();
          sesionValida = false;
          informar("Contraseña actualizada. Volvé al acceso e iniciá sesión con la nueva contraseña.");
        } catch (error) {
          informar("Ocurrió un error de conexión. Intentá nuevamente.");
        } finally {
          guardar.disabled = !sesionValida;
        }
      });

      guardar.disabled = true;
      iniciar();
    })();
  </script>
</body>
</html>
