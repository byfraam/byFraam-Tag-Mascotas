<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111"><title>Perfil de mascota | by Fraam</title><link rel="stylesheet" href="../style.css"></head><body><header class="top"><a class="brand" href="../">by <b>Fraam</b></a><span>TAG MASCOTAS</span></header><main class="page narrow"><div id="status" class="status" role="status">Cargando perfil...</div><section id="profile" class="panel" hidden><div id="photo"></div><div style="padding-top:16px"><p class="eyebrow">MASCOTA IDENTIFICADA</p><h1 id="name" style="font-size:40px"></h1><p id="species" class="muted"></p><p id="breed" class="muted"></p><p id="description"></p><a id="call" class="btn primary" hidden>Contactar por teléfono</a><a id="whatsapp" class="btn primary" style="margin-top:10px" target="_blank" rel="noopener" hidden>Contactar por WhatsApp</a><a id="report" class="btn" style="margin-top:10px" hidden>Avisar que la encontré</a></div></section><p class="muted" style="font-size:12px;text-align:center">La información visible fue autorizada por la familia de la mascota.</p></main><footer>BY FRAAM STUDIO · TAG MASCOTAS</footer><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script><script src="../js/config.js"></script><script src="../js/supabase.js"></script><script>
(async()=>{const db=window.BF,el=id=>document.getElementById(id),tag=new URLSearchParams(location.search).get('id');function fail(t){el('status').textContent=t;el('profile').hidden=true;}if(!tag){fail('Este enlace no contiene el código de la mascota.');return;}if(!db){fail('El sitio todavía no está configurado.');return;}const {data,error}=await db.rpc('get_public_pet',{p_tag_code:tag});if(error||!data||!data.length){console.error(error);fail('No encontramos una mascota con este código.');return;}const p=data[0];el('name').textContent=p.name;el('species').textContent=p.species||'';el('breed').textContent=p.breed?'Raza: '+p.breed:'';el('description').textContent=p.description||'';if(p.photo_url){const img=document.createElement('img');img.src=p.photo_url;img.alt='Foto de '+p.name;img.className='photo';img.referrerPolicy='no-referrer';el('photo').append(img);}if(p.public_contact_phone&&/^[0-9+().\s-]{6,30}$/.test(p.public_contact_phone)){el('call').href='tel:'+p.public_contact_phone.replace(/[^\d+]/g,'');el('call').hidden=false;}if(p.public_whatsapp){const n=p.public_whatsapp.replace(/\D/g,'');if(n.length>=8&&n.length<=15){el('whatsapp').href='https://wa.me/'+n;el('whatsapp').hidden=false;}}el('report').href='../reportar/?id='+encodeURIComponent(tag);el('report').hidden=false;el('status').textContent=p.is_missing?'¡Esta mascota está reportada como perdida!':'Perfil de mascota identificada';if(p.is_missing)el('status').classList.add('lost');el('profile').hidden=false;})();
</script></body></html>
