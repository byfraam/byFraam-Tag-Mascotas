
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111111">
  <title>Mascota identificada | by Fraam</title>
  <style>
    :root {
      color-scheme: dark;
      --fondo: #101010;
      --panel: #1c1c1c;
      --texto: #f5f5f5;
      --secundario: #b9b9b9;
      --borde: #373737;
      --acento: #d6ff65;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--fondo);
      color: var(--texto);
      font-family: Arial, Helvetica, sans-serif;
    }

    header, footer {
      padding: 22px;
      text-align: center;
      border-bottom: 1px solid var(--borde);
    }

    .marca {
      font-weight: 800;
      letter-spacing: 2px;
    }

    .marca span { color: var(--acento); }

    main {
      width: min(100% - 32px, 520px);
      margin: 36px auto;
    }

    .estado {
      padding: 12px 15px;
      border-radius: 10px;
      background: #292929;
      color: var(--secundario);
      font-size: 14px;
      text-align: center;
    }

    .estado.perdida {
      background: #482323;
      color: #ffd7d7;
    }

    .tarjeta {
      margin-top: 18px;
      overflow: hidden;
      border: 1px solid var(--borde);
      border-radius: 18px;
      background: var(--panel);
    }

    .foto {
      display: grid;
      place-items: center;
      min-height: 200px;
      background: #242424;
      color: var(--secundario);
      padding: 24px;
      text-align: center;
    }

    .datos { padding: 24px; }

    h1 {
      margin: 0 0 10px;
      font-size: 32px;
    }

    .dato {
      color: var(--secundario);
      line-height: 1.7;
      overflow-wrap: anywhere;
    }

    .boton {
      display: block;
      width: 100%;
      margin-top: 12px;
      padding: 15px;
      border: 1px solid var(--acento);
      border-radius: 10px;
      background: var(--acento);
      color: #111;
      text-decoration: none;
      text-align: center;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .boton.secundario {
      background: transparent;
      color: var(--texto);
      border-color: var(--borde);
    }

    .nota {
      color: var(--secundario);
      font-size: 12px;
      line-height: 1.6;
      text-align: center;
      margin: 22px 0;
    }

    footer {
      border-top: 1px solid var(--borde);
      border-bottom: 0;
      color: var(--secundario);
      font-size: 12px;
    }
  </style>
</head>
<body>
  <header>
    <div class="marca">by <span>Fraam</span></div>
    <div style="margin-top:7px;font-size:11px;letter-spacing:3px">
      TAG MASCOTAS
    </div>
  </header>

  <main>
    <div id="estado" class="estado">Cargando información...</div>

    <section class="tarjeta">
      <div id="foto" class="foto">Perfil de mascota</div>

      <div class="datos">
        <h1 id="nombre">Mascota</h1>
        <div id="especie" class="dato"></div>
        <div id="raza" class="dato"></div>
        <p id="descripcion" class="dato"></p>

        <a id="llamar" class="boton" hidden>Contactar por teléfono</a>
        <a id="whatsapp" class="boton" hidden
           target="_blank" rel="noopener noreferrer">
          Contactar por WhatsApp
        </a>

        <a id="reportar" class="boton secundario" hidden>
          Informar que encontré esta mascota
        </a>
      </div>
    </section>

    <p class="nota">
      by Fraam Tag Mascotas · Compartimos únicamente información
      autorizada para ayudar a reunir mascotas con sus familias.
    </p>
  </main>

  <footer>BY FRAAM STUDIO</footer>

  <script>
    // La conexión con Supabase se agregará en una etapa posterior.
    // No se muestran datos inventados ni información privada.

    const estado = document.getElementById("estado");
    const params = new URLSearchParams(window.location.search);
    const tag = params.get("id");

    if (!tag) {
      estado.textContent =
        "No se recibió el código de identificación de la mascota.";
    } else {
      estado.textContent =
        "Código recibido. La conexión segura con la base de datos todavía está pendiente.";
    }

    // Evitamos que se invente un perfil o se muestren datos de otra mascota.
  </script>
</body>
</html>
