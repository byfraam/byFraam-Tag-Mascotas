<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Avisar que encontré una mascota | by Fraam</title><link rel="stylesheet" href="../style.css"></head><body><header class="top"><a class="brand" href="../">by <b>Fraam</b></a><span>TAG MASCOTAS</span></header><main class="page narrow"><section class="panel"><p class="eyebrow">AYUDÁ A QUE VUELVA A CASA</p><h1 style="font-size:36px">¿Encontraste a esta mascota?</h1><p id="petStatus" class="status">Verificando mascota...</p><form id="form"><label for="finder">Tu nombre</label><input id="finder" maxlength="80" autocomplete="name"><label for="phone">Tu teléfono</label><input id="phone" maxlength="40" type="tel" autocomplete="tel"><label for="location">¿Dónde la encontraste?</label><input id="location" maxlength="200"><label for="message">Mensaje</label><textarea id="message" maxlength="1000" placeholder="Cómo está o cualquier dato útil"></textarea><button class="primary" id="send" type="submit" disabled>Preparando formulario...</button><p id="result" class="msg" role="status"></p></form><p class="muted" style="font-size:12px">Compartí solo los datos necesarios para ayudar a la mascota.</p></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script><script src="../js/config.js"></script><script src="../js/supabase.js"></script><script>
(async()=>{const db=window.BF,el=id=>document.getElementById(id),tag=new URLSearchParams(location.search).get('id');let ready=false;if(!tag||!/^[0-9a-f-]{36}$/i.test(tag)){el('petStatus').textContent='El enlace no contiene un código válido.';return;}if(!db){el('petStatus').textContent='El sitio todavía no está configurado.';return;}const {data,error}=await db.rpc('get_public_pet',{p_tag_code:tag});if(error||!data||!data.length){el('petStatus').textContent='No encontramos la mascota o no pudimos cargar su perfil.';return;}el('petStatus').textContent='Aviso para: '+data[0].name+'. Completá al menos un campo.';ready=true;el('send').disabled=false;el('send').textContent='Enviar aviso';el('form').onsubmit=async e=>{e.preventDefault();if(!ready)return;const vals={p_tag_code:tag,p_finder_name:el('finder').value.trim()||null,p_finder_phone:el('phone').value.trim()||null,p_location_text:el('location').value.trim()||null,p_message:el('message').value.trim()||null};if(!vals.p_finder_name&&!vals.p_finder_phone&&!vals.p_location_text&&!vals.p_message){el('result').textContent='Completá al menos un campo.';return;}el('send').disabled=true;el('send').textContent='Enviando...';const {error}=await db.rpc('submit_found_report',vals);if(error){console.error(error);el('result').textContent=error.message.includes('límite temporal')?'Se alcanzó el límite temporal de avisos. Intentá más tarde.':'No se pudo enviar el aviso. Intentá nuevamente más tarde.';el('send').disabled=false;el('send').textContent='Enviar aviso';return;}el('result').textContent='¡Aviso enviado! Gracias por ayudar a esta mascota.';el('result').className='msg ok';el('form').reset();ready=false;el('send').textContent='Aviso enviado';};})();
</script></body></html>
